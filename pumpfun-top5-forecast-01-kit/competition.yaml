    method: automated
    summary: "Every final entry forecasts the 5 largest pump.fun coins by market cap among those launched from 2026-11-12T02:00:00Z, at the house recorder's seven hourly answer reads from 2026-11-12T20:00:00Z to 2026-11-13T02:00:00Z (a probability for each coin at each place, and each place's market cap in 82 bins), from the marks to 2026-11-12T13:00:00Z, and ranks by its mean log score over those reads, highest first: 1st place goes to the best forecast. Beating the best house entry only qualifies a forecast; the 10 highest-scoring forecasts that beat it take the 10 places, one per entrant, and a paid place a house bot holds is not awarded. The highest log score wins $50, ten places paying $200 in all."
    criteria:
      - "Harness: program/v1; the entry runs offline on the history (input/) and writes /output/forecast.json, twice on the same history with the outputs compared, and the sealed scorer scores it against each answer read and takes the mean"
      - "Coins: created by the pump.fun program 6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P with a CreateEvent timestamp at or after 2026-11-12T02:00:00Z and quoted in SOL, a mayhem-mode coin ranked only once its canonical PumpSwap pool prices it; each market cap in lamports on the coin's own total supply (10^15 raw units, 2 x 10^15 for a mayhem-mode coin), from the coin's bonding curve or its canonical PumpSwap pool read in one call"
      - "Answer: seven house-recorder answer reads hourly from 2026-11-12T20:00:00Z to 2026-11-13T02:00:00Z, each the 100 largest such coins at the first answer read that read every coin and started within 15 minutes of its instant (the last from 2026-11-13T02:00:00Z up to but not including 2026-11-13T02:15:00Z); an instant with none is left out, and with none at all there is no answer and no prize"
      - "Rank: the mean over the answer reads present of the order score (ln of the probability given the coin actually at each of the 5 places, its own row, else the place's unnamed share over the chart's coins not named there) plus the size score (ln of the probability given each place's market cap bin, 82 bins of log10 of the cap in SOL, 0.05 wide), each floored at 0.0001, to 6 decimals; a row naming a mint the history never names is dropped, its probability back in the place's unnamed share; ties by the top-5 agreement summed over the reads (5 minus the place distance per shared coin, 0 to 25 a read, up to 175), then the earlier receipt"
      - "Prizes: $50 for 1st place, $30 for 2nd, $24 for 3rd, $20 for 4th, $16 for 5th and $12 each for 6th to 10th, one place per entrant, in USDC on Solana; a paid place a house bot holds is not awarded, and no entry moves up to take it"
      - "Beat the house: a prize needs a log score strictly above the best house entry's on the final, the house persistence baseline's or the house model forecast's; an entry that does not beat it keeps its rank and takes no place, and a place no entry is left to take is not awarded"
      - "Payout: in USDC on Solana only, and the bounty's page says which way: when the reward is locked in make.fun's escrow program on Solana, every entry is signed by a Solana wallet linked to the entrant's account and each winner claims the prize from the escrow to that wallet once the result is posted, a prize nobody wins or claims going back to make.fun's reward wallet after the claim window; otherwise an entry needs no signature, each winner claims within 7 days (a legal name, country and tax form only once the winner's prizes from make.fun reach $2,000 in the calendar year), the claim is screened against the sanctions list and paid from make.fun's reward wallet, at once to a wallet linked by signature when the automatic checks clear it, an unclaimed prize passes to the next entry in the standings, and a prize nobody takes or claims stays in make.fun's reward wallet for later contests"
      - "Reproducible: the final dataset (the history, each answer read's chart with each row's slot, and the history's mints) is published with the results, so anyone can check every row against the chain and run and score every final entry again"
    source: Public Solana mainnet account state of the pump.fun coins launched from the opening (their bonding curves and canonical PumpSwap pools), read every 10 minutes and at the seven answer reads by the house recorder
    verifier: make.fun grader runs every final entry twice on the frozen final dataset and scores it with the sealed scorer; the results are published and resolved automatically once the final grades, the regrades of the would-be winners and the scan for copies are done
    tie_break: Equal log scores go to the higher top-5 agreement, then to the earlier receipt
    announce: Final leaderboard within 7 days of the deadline unless a check holds it; in USDC on Solana, winners claim from make.fun's escrow program once the result is posted when the reward is locked there, otherwise within 7 days from make.fun's reward wallet
