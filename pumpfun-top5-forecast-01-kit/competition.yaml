# market cap 24 hours after it, and how large each place's market cap will be. Validated by server/competitions/load.ts
# against contracts/competition.ts; seeded by `npm run db:seed`. tests/unit/comp-pumpfun-top5-forecast-01.test.ts holds
# the bundle, its rules' quotes and its grading end to end. The owner's ask of 2026-11-11: "predicting what pump.fun
# tokens will be the top 5 market cap in 24h from start (now) that have NOT been created BEORE the start timestamp of the
# competition. the competition ends in 12h then checks in 12h to see who was closest to the state at that moment in
# time." It follows the forecast-bundle template grader/forecast/ranked.ts states (.cosmos/rules/contest-design.mdc), as
# roblox-up-and-coming-forecast-01 (its nearest twin: one place matrix) and xstocks-movers-forecast-01 (its sizes) do.
#
# The coins (collector/pump-forecast/market.ts, record.ts): every coin the pump program
# 6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P creates with its CreateEvent's timestamp at or after T0 and its quote mint
# SOL (11111111111111111111111111111111), mayhem coins included; a coin quoted in USDC or another coin is left out (v1,
# the root's ruling). A mayhem-mode coin counts (eligible, priced) but is ranked only once its pool prices it (market.ts
# onChart/rankRows, item #80): on its curve its price stands on virtual reserves with almost no SOL behind them, so the
# chart leaves out coins pump.fun's own site lists, and a forecast naming one the history never ranked is dropped like
# a coin born after the cut (knownOnly, below). Its market cap is in lamports on the coin's own total supply in raw
# units: 1e15 (pump.fun's 1B at 6 decimals) for an ordinary coin, 2e15 for a mayhem coin (pump.fun's docs, "2,000,000,000
# total token supply"; item #83), from its own accounts read in one getMultipleAccounts (market.ts and its three venues:
# curve, migrating, pool on the canonical PumpSwap pool), never mint.supply, another pool, an event, pump.fun's API or a
# vendor price.
# The house recorder (deploy/k8s/components/pumpfun-top5-forecast) reads every 10 minutes on the grid from T0 (kind
# mark), and seven answer reads hourly from T0+18h to T0+24h (kind answer, each retried each minute 15 times at most;
