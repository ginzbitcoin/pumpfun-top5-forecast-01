# {deadline, answer_at: the final phase's start} by server/admin/dataset-register.ts's pump family). The dev phase
# grades on this directory's own sealed practice instance (input/, reference/), cut by `cli.ts practice
# --history-until 2026-11-11T21:00:00Z --deadline 2026-11-11T21:00:00Z --answer-at 2026-11-11T22:00:00Z --reads 7
# --read-every 10` from the 2-hour dev rehearsal the same recorder made from 2026-11-11T20:00:00Z (rehearsal2, the
# root's ruling; item #43 cuts it): 1 hour of marks and seven reads every 10 minutes from the cut to one hour after it
# (its marks answer them, an answer read first at one time), a 2-hour miniature of the final (11 hours of marks, seven
# reads hourly from 7 to 13 hours after the cut).
#
# Scoring (scorer/score.ts; scorer/forecast.ts over scorer/ranked.ts, grader/forecast/ranked.ts byte for byte;
# node22 stdlib): log_score, the rank, the order log score over places 1 to 5 (each place's mint, a place's unnamed mass
# shared by the chart's coins not named there, which is how a coin born after the cut is scored) plus the size log score
# over the five places' caps in 82 bins of log10(cap in SOL), edges 2.00 to 6.00 at 0.05; floor 1e-4 each; on every
# answer read present, the rank their mean, from 0 down to -92.103404. A forecast row naming a mint the history never
